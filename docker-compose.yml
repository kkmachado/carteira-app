services:
  carteira:
    build: .
    container_name: carteira
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET}
      - PLUGGY_ITEM_ID=${PLUGGY_ITEM_ID}
      - PORT=${PORT}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
