services:
  carteira:
    build: .
    image: carteira-app:local
    container_name: carteira
    restart: unless-stopped
    ports:
      # mode: host — o routing mesh (ingress) do Swarm não entrega no homelab
      - target: 3000
        published: ${HOST_PORT:-3000}
        protocol: tcp
        mode: host
    environment:
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET}
      - PLUGGY_ITEM_ID=${PLUGGY_ITEM_ID}
      - PORT=${PORT}
      - CARD_HOLDERS=${CARD_HOLDERS}
      - GASTOS_IGNORAR_CONTAS=${GASTOS_IGNORAR_CONTAS}
    volumes:
      - /opt/carteira/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
